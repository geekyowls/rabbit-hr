name: rabbithr

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: rabbithr-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    NODE_ENV: production
    DB_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    STORAGE_SERVICE: S3
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    image: rustfs/rustfs:1.0.5
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - "${STORAGE_PORT:-19000}:9000"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage-init:
    image: amazon/aws-cli:2.40.1
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3="aws --endpoint-url http://storage:9000"
        $$s3 s3api head-bucket --bucket "$$S3_BUCKET_NAME" 2>/dev/null || $$s3 s3 mb "s3://$$S3_BUCKET_NAME"
        $$s3 s3api put-bucket-cors --bucket "$$S3_BUCKET_NAME" --cors-configuration "{\"CORSRules\":[{\"AllowedOrigins\":[\"$$FRONTEND_URL\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}"
        echo "bucket $$S3_BUCKET_NAME ready"

  api:
    <<: *backend
    ports:
      - "${API_PORT:-14000}:4000"

  worker:
    <<: *backend
    command: ["node", "dist/src/worker.js"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_URL: ${FRONTEND_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_GLITCHTIP_DSN: ${NEXT_PUBLIC_GLITCHTIP_DSN:-}
    image: rabbithr-frontend:local
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-13000}:8080"

volumes:
  postgres-data:
  redis-data:
  storage-data:
